name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html telemetry.js StormpathV1_3_5.html 404.html .nojekyll _site/
          cp -R intel vehicles _site/

      - name: Read Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(gh api "repos/${{ github.repository }}/pages")
          echo "$info"
          bt=$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type") or "")')
          url=$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url") or "")')
          branch=$(printf '%s' "$info" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("source") or {}).get("branch")) or "")')
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          echo "page_url=$url" >> "$GITHUB_OUTPUT"
          echo "source_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Pages build_type=${bt} source_branch=${branch} url=${url}"

      - name: Setup Pages
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Legacy branch source notice
        if: steps.pages.outputs.build_type != 'workflow'
        run: |
          echo "::notice::GitHub Pages is Deploy-from-a-branch (${{ steps.pages.outputs.source_branch }}). actions/deploy-pages is skipped. Live URL: ${{ steps.pages.outputs.page_url }}"
